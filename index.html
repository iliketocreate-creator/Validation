<!DOCTYPE html>
<html lang="en">
<head>

    <title>Validation: Guess the Number</title>
    <style>
        body {
            font-family: italic, pixels, sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #08a7eb;
        }
        input {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            color: rgb(93, 4, 236);
            background-color: rgb(234, 129, 2);
            border-radius: 240px;
        }
        </style>
</head>
<body>
    <h1>Guess the Number</h1>
    <p>This is a simple number guessing game.</p>
    <input type="text" id="name" placeholder="Enter your name" required>
    <p id="msg-name"></p>
     <input type="number" id="guess" placeholder="Enter your guess from 1 to 5" required>
    <p id="msg-guess"></p>
    <button onclick="checkGuess()">Check Guess</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>
        var seconds = 0;
        setInterval(function() {
            seconds = seconds + 1;
            document.getElementById("timer").innerHTML = "You have been playing for " + seconds + " seconds";
        }, 1000);
        
            function checkGuess() { 
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;
            
              if (name == "") {
                document.getElementById("msg-name").innerHTML = "Please enter your name.";
                ok = false;
                } else {
                document.getElementById("msg-name").innerHTML = "";
                }   
            if (guess == "") {
                document.getElementById("msg-guess").innerHTML = "Please enter your guess.";
                ok = false;
                } else if (guess < 1 || guess > 5) {
                document.getElementById("msg-guess").innerHTML = "Please enter a number between 1 and 5.";
                ok = false;
                } else {
                document.getElementById("msg-guess").innerHTML = "";
                }
                if(ok==true){
                    var luckyNumber = Math.floor(Math.random() * 5) + 1;
                    if (guess == luckyNumber) {
                        document.getElementById("result").innerHTML = "Congratulations " + name + "! You guessed the lucky number " + luckyNumber + "!";
                    } else {
                        document.getElementById("result").innerHTML = "Sorry " + name + ", the lucky number was " + luckyNumber + ". Better luck next time!";
                    }
                }
            }
    </script>
</body>
</html>
